<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templo Digital · Reto 4 AJAX</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="templo-header">
        <h1>⛩️ Templo Digital de Asakusa</h1>
        <p class="subtitulo">Reto 4 · AJAX + JSONPlaceholder</p>
    </header>

    <main class="contenedor">
        <section class="panel-controles">
            <button id="btn-cargar" class="btn-samurai">⚔️ Cargar Posts</button>
            <button id="btn-limpiar" class="btn-secundario">🧹 Limpiar</button>
        </section>

        <div id="loader" class="loader oculto">
            <div class="spinner"></div>
            <p>Cargando datos del templo…</p>
        </div>

        <div id="error" class="mensaje-error oculto"></div>

        <section id="resultado" class="resultado"></section>
    </main>

    <footer class="templo-footer">
        <p>Samurái del código · <span id="anio"></span></p>
    </footer>

    <script src="api-request.js"></script>
</body>
</html>
